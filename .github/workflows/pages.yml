name: Deploy to GitHub Pages

# Publish only on a release tag (e.g. v1.3.0, matching the gooze release the
# docs describe), so merging docs to main doesn't go live until that release.
# workflow_dispatch redeploys by hand, e.g. for an urgent fix; the
# github-pages environment limits it to main and v* tags.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: gooze.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the sitemap can derive real per-page lastmod dates
          # from git (a shallow checkout would make them all fall back to the
          # build date).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            echo "$CUSTOM_DOMAIN" > public/CNAME
            npm run build
            echo "$CUSTOM_DOMAIN" > out/CNAME
          else
            BASE_PATH="/${{ github.event.repository.name }}" npm run build
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
